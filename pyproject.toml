[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "esphomerelease"
version = "1.0"
requires-python = ">=3.12"
dependencies = [
  "github3.py==3.2.0",
  "click==8.0.4",
  "requests==2.34.2",
  "PyYAML==6.0.3",
  "pexpect==4.9.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.17.0",
  "ty>=0.0.86",
]

[project.scripts]
esphomerelease = "esphomerelease.__main__:main"
espr = "esphomerelease.__main__:main"

[tool.setuptools]
packages = ["esphomerelease"]

[tool.setuptools.package-data]
esphomerelease = ["esphome-logo.png"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "FURB", "ISC", "PERF", "PIE", "PL", "PT", "PTH", "RET", "RUF", "SIM"]
ignore = [
  "PLR0913", # too-many-arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "PLC0415", # import-outside-top-level: fixtures import modules after writing a temp config.json
  "PLR2004", # magic-value-comparison: expected counts in asserts
  "PLR0917", # too-many-positional-arguments: pytest fixtures arrive as positional parameters
]

[tool.ruff.lint.pylint]
# Ceiling at today's largest function so branch counts don't grow further.
max-branches = 17

[tool.ruff.lint.isort]
known-first-party = ["esphomerelease"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["esphomerelease", "check_docs_prs"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
